# All data and logs live in MongoDB Atlas (MONGODB_URI in .env).
services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"
